version: "3.9"
services:
  mysql_403:
    env_file:
      - .env
    container_name: mysql_403
    hostname: mysql_403
    image: mysql:8
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_force_recovery=0
    volumes:
      - mysql_403_data:/var/lib/mysql
    ports:
      - 3307:3306
    environment:
      TZ: America/Sao_Paulo

volumes:
  mysql_403_data:
